<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07120d"><title>SWAMP RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#06100b;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:16px;font-weight:900}.wallet{display:flex;gap:8px}.pill{background:#07120ddd;border:1px solid #49614c;border-radius:18px;padding:8px 11px}.menu{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:min(360px,82%);text-align:center;pointer-events:auto}.title{font-size:44px;font-weight:1000;letter-spacing:3px;text-shadow:0 5px 18px #000;margin-bottom:12px}.sub{color:#b5c8b8;font-size:12px;margin-bottom:18px}.btn{width:100%;border:0;border-radius:16px;padding:16px;background:#c6ff2e;color:#071000;font-size:18px;font-weight:1000;box-shadow:0 8px 0 #678d12}.row{display:flex;gap:9px;margin-top:14px}.smallbtn{flex:1;background:#101d16;color:#fff;border:1px solid #526755;border-radius:13px;padding:12px;font-weight:800}.char{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);font-size:86px;filter:drop-shadow(0 10px 8px #000);animation:bob .7s infinite alternate}.charname{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);font-weight:900;font-size:18px}.switch{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);pointer-events:auto;background:#101d16;color:#fff;border:1px solid #526755;border-radius:12px;padding:9px 15px}.game{display:none}.gamebar{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;font-weight:900}.hint{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);color:#d7e5d9;background:#07120dcc;padding:8px 13px;border-radius:14px;font-size:12px}.over{display:none;position:absolute;inset:0;background:#0009;align-items:center;justify-content:center;text-align:center}.panel{background:#101b14;border:1px solid #526755;border-radius:20px;padding:25px;width:82%;max-width:360px}.panel h2{font-size:30px}.panel button{margin-top:10px}.active{display:flex!important}@keyframes bob{to{transform:translateX(-50%) translateY(-8px)}} 
</style></head>
<body><canvas id="c"></canvas>
<div class="ui">
<div id="home">
<div class="top"><div>SWAMP RUSH</div><div class="wallet"><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">💎 <b id="rare">0</b></span><span class="pill">🔑 <b id="keys">0</b></span></div></div>
<div class="char" id="char">👧</div><div class="charname" id="charname">MISHA</div>
<div class="menu"><div class="title">SWAMP RUSH</div><div class="sub">RUN. ESCAPE. MASTER THE SWAMP.</div><button class="btn" onclick="start()">PLAY</button><div class="row"><button class="smallbtn" onclick="switchChar()">CHARACTER: MISHA</button><button class="smallbtn" onclick="biome()">BIOMES</button></div></div></div>
<div id="game" class="game"><div class="gamebar"><span>🏃 <b id="score">0</b></span><span>🪙 <b id="gcoins">0</b></span></div><div class="hint">SWIPE / ARROW KEYS · LEFT · RIGHT · UP TO JUMP</div></div>
<div id="over" class="over"><div class="panel"><h2>CAUGHT!</h2><div>Score: <b id="final">0</b></div><button class="btn" onclick="restart()">RUN AGAIN</button><button class="smallbtn" onclick="home()">HOME</button></div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,run=false,lane=1,target=1,y=0,vy=0,score=0,gcoins=0,last=0,obs=[],coins=0,rare=0,keys=0,char=0;
coins=+localStorage.coins||0;rare=+localStorage.rare||0;keys=+localStorage.keys||0;
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
function save(){localStorage.coins=coins;localStorage.rare=rare;localStorage.keys=keys;document.getElementById('coins').textContent=coins;document.getElementById('rare').textContent=rare;document.getElementById('keys').textContent=keys}
function draw(t){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#132e24');g.addColorStop(.55,'#254d32');g.addColorStop(1,'#07130c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<14;i++){ctx.fillStyle=i%2?'#102b1c':'#193a25';let x=(i*97+(t*.025)%100);ctx.beginPath();ctx.arc(x,H*.28,35,0,7);ctx.fill()}
ctx.fillStyle='#102019';ctx.beginPath();ctx.moveTo(W*.28,H);ctx.lineTo(W*.44,H*.34);ctx.lineTo(W*.56,H*.34);ctx.lineTo(W*.72,H);ctx.fill();
ctx.strokeStyle='#496b42';ctx.lineWidth=3;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(W*(.44+i*.04),H*.36);ctx.lineTo(W*(.42+i*.05),H);ctx.stroke()}
if(run){drawPlayer();obs.forEach(o=>drawObstacle(o));drawCoins()}requestAnimationFrame(draw)}
function drawPlayer(){let x=W*(.44+lane*.06),base=H*.78+y;ctx.font=`${70*devicePixelRatio}px Arial`;ctx.textAlign='center';ctx.fillText(char?'🏃':'👧',x,base)}
function drawObstacle(o){let x=W*(.44+o.lane*.06),yy=H*.3+o.z*(H*.5);ctx.font=`${45*devicePixelRatio}px Arial`;ctx.textAlign='center';ctx.fillText(o.kind==='tree'?'🪵':'🪨',x,yy)}
function drawCoins(){for(let i=0;i<3;i++){let z=(score*.002+i*.3)%1,x=W*(.44+((i%3)-1)*.06);ctx.font=`${28*devicePixelRatio}px Arial`;ctx.fillText('🪙',x,H*.32+z*H*.5)}}
function start(){run=true;document.getElementById('home').style.display='none';document.getElementById('game').classList.add('active');document.getElementById('over').classList.remove('active');score=0;gcoins=0;obs=[];last=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;score+=dt*100;gcoins+=dt*.3;if(Math.random()<dt*.7)obs.push({lane:Math.floor(Math.random()*3),z:0,kind:Math.random()<.5?'tree':'rock'});obs.forEach(o=>o.z+=dt*.42);obs=obs.filter(o=>o.z<1.05);let hit=obs.some(o=>o.lane===lane&&o.z>.84&&o.z<1.0&&!y);if(hit){gameover();return}document.getElementById('score').textContent=Math.floor(score);document.getElementById('gcoins').textContent=Math.floor(gcoins);requestAnimationFrame(loop)}
function gameover(){run=false;coins+=Math.floor(gcoins);save();document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.add('active')}
function restart(){document.getElementById('over').classList.remove('active');start()}function home(){run=false;document.getElementById('over').classList.remove('active');document.getElementById('game').classList.remove('active');document.getElementById('home').style.display='block'}
function switchChar(){char=1-char;document.getElementById('char').textContent=char?'🏃':'👧';document.getElementById('charname').textContent=char?'DEL':'MISHA';document.querySelector('.smallbtn').textContent='CHARACTER: '+(char?'DEL':'MISHA')}
function biome(){alert('BIOMES\\n\\n🌿 Swamp — FREE\\n🌲 Dark Jungle — 500 coins\\n🏛️ Ancient Ruins — 1500 coins\\n❄️ Frozen Valley — COMING SOON')}
function move(n){target=Math.max(0,Math.min(2,target+n));lane=target}function jump(){if(!y){vy=1.8}}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp')jump()});let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30)move(dx>0?1:-1);else if(dy<-30)jump()});
setInterval(()=>{if(y||vy){y+=vy;vy-=.08;if(y<0){y=0;vy=0}}},16);save();requestAnimationFrame(draw);
</script></body></html>
